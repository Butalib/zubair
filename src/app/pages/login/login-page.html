<main class="auth-page" dir="rtl">
  <section class="auth-card" aria-labelledby="login-title">
    <header class="auth-card__header">
      <img class="auth-card__logo" src="assets/images/logo.png" alt="زبير أونلاين" />

      <h1 id="login-title">مرحباً بك</h1>
      <p>سجل دخولك للمتابعة</p>
    </header>

    <form class="auth-form" [formGroup]="loginForm" (ngSubmit)="submitLogin()" novalidate>
      <div class="auth-field">
        <label for="phoneNumber">رقم الجوال</label>
        <input id="phoneNumber" type="tel" inputmode="numeric" autocomplete="tel" placeholder="07XXXXXXXXX"
          formControlName="phoneNumber" aria-describedby="phone-error" />
        @if (loginForm.controls.phoneNumber.invalid && loginForm.controls.phoneNumber.touched) {
        <small id="phone-error" class="auth-field__error">رقم الجوال مطلوب.</small>
        }
      </div>

      <div class="auth-field">
        <label for="password">كلمة المرور</label>
        <div class="password-field">
          <input id="password" [type]="isPasswordVisible ? 'text' : 'password'" autocomplete="current-password"
            placeholder="********" formControlName="password" aria-describedby="password-error" />
          <button class="password-field__toggle" type="button"
            [attr.aria-label]="isPasswordVisible ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور'"
            [attr.aria-pressed]="isPasswordVisible" (click)="togglePasswordVisibility()">
            @if (isPasswordVisible) {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.2A10.8 10.8 0 0 1 12 5c5 0 8.6 4.2 9.7 6.1a1.8 1.8 0 0 1 0 1.8 18 18 0 0 1-3.1 3.8M6.2 6.3A17.8 17.8 0 0 0 2.3 11.1a1.8 1.8 0 0 0 0 1.8C3.4 14.8 7 19 12 19c1.2 0 2.3-.2 3.3-.6" />
            </svg>
            } @else {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2.3 12S5.8 5 12 5s9.7 7 9.7 7-3.5 7-9.7 7S2.3 12 2.3 12Z" />
              <circle cx="12" cy="12" r="2.8" />
            </svg>
            }
          </button>
        </div>
        @if (loginForm.controls.password.invalid && loginForm.controls.password.touched) {
        <small id="password-error" class="auth-field__error">كلمة المرور مطلوبة.</small>
        }
      </div>

      <a class="forgot-password" href="#">نسيت كلمة المرور؟</a>

      <button class="login-button" type="submit">تسجيل الدخول</button>
    </form>

    <div class="auth-divider" aria-hidden="true">
      <span></span>
      <strong>أو</strong>
      <span></span>
    </div>

    <p class="register-prompt">
      ليس لديك حساب؟
      <a href="#">إنشاء حساب جديد</a>
    </p>
  </section>
</main>
